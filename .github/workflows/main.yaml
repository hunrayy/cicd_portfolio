name: "cicd_portfolio"
on:
  push:
    branches:
    - master
jobs:
  deployment:
    runs-on: ubuntu-latest
    steps:

    - name: List the directory
      run: |
        ls

    - name: Checkout to root directory
      uses: actions/checkout@v4

    - name: List the directory again
      run: |
        ls

    - name: build a docker image using the dockerfile in root directory
      run: |
        sudo docker build -t henryokiyi/cicd_portfolio .

    - name: Login to dockerhub
      run: |
        sudo docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

    - name: push the image built to dockerhub
      run: |
        sudo docker push henryokiyi/cicd_portfolio:latest






